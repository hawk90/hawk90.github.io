# lefthook.yml — Git hooks for hawk90.github.io
#
# 설치: `lefthook install` (한 번만)
# 우회: `git commit --no-verify` (긴급 시)
# lefthook 2.2.1 이상. 2.1.16은 git worktree에서 일부만 stage된 파일이 있으면
# "failed to save all unstaged changes"로 커밋을 막는다(brew upgrade lefthook).
min_version: 2.2.1

# `dir/**/*.ext`가 dir 바로 아래 파일도 잡도록. 기본 matcher에서는
# public/images/blog/_design*.tex가 diagram-fresh에 한 번도 걸리지 않았다.
glob_matcher: doublestar

pre-commit:
  parallel: false
  commands:
    # 변경된 .md 파일에 대해서만 publish gate 실행
    publish-gate:
      glob:
        - "src/content/blog/**/*.md"
      run: |
        echo "▶ Running publish gate on staged .md files..."
        ./scripts/audit-publish-gate.sh {staged_files}
      fail_text: |
        ✗ Publish gate failed.
        규칙을 위반한 파일이 있습니다 (CLAUDE.md §6·§10 참조).
        긴급 시 `git commit --no-verify`로 우회 가능 (CLAUDE.md 위반 책임 본인).

    # 태그는 URL 세그먼트다. "Secure Boot"는 /tags/secure%20boot로 나간다.
    # 막지 않고 고친다 — 의도는 분명하고 수리는 기계적이다. 바뀐 내용은
    # 출력에 남고 stage_fixed로 같은 커밋에 포함된다.
    tag-shape:
      glob:
        - "src/content/blog/**/*.md"
      run: node scripts/normalize-tag-shape.mjs --apply --quiet {staged_files}
      stage_fixed: true

    # .tex를 고치고 .svg를 다시 빌드하지 않은 채 커밋하는 것을 막는다.
    # .svg 안의 tikz-src 해시(scripts/build-diagrams.sh)가 .tex+의존 파일과
    # 일치해야 통과. _design*.tex가 바뀌면 그 스타일을 쓰는 전체를 검사한다.
    diagram-fresh:
      glob:
        - "public/images/blog/**/*.tex"
        - "public/images/blog/**/*.svg"
      run: |
        status=0
        case " {staged_files} " in
          *"/_design"*) ./scripts/build-diagrams.sh --check || status=1 ;;
          *)
            for f in {staged_files}; do
              tex="${f%.*}.tex"
              [ -f "$tex" ] || continue
              # Keep the exit code: piping into grep let a crashed check pass.
              out=$(./scripts/build-diagrams.sh --check "$PWD/$tex" 2>&1) || status=1
              printf '%s\n' "$out" | grep '^✗' && status=1
            done ;;
        esac
        exit $status
      fail_text: |
        ✗ .svg가 .tex와 맞지 않습니다. `npm run diagrams`로 다시 빌드한 뒤 커밋하세요.

    # 직접 실행되는 스크립트(./scripts/x, $ROOT/scripts/x)가 실행 비트를 잃으면
    # publish gate가 그 검사를 건너뛴 채 통과한다. scripts/가 바뀔 때마다 확인.
    script-modes:
      glob:
        - "scripts/**"
        - "lefthook.yml"
        - "package.json"
      run: node scripts/check-script-modes.mjs

    # 가격 `$20K~$40K`처럼 의도하지 않은 인라인 수식
    inline-math:
      glob:
        - "src/content/blog/**/*.md"
      run: node scripts/check-inline-math.mjs {staged_files}
    frontmatter-required:
      glob:
        - "src/content/blog/**/*.md"
      # frontmatter 블록 안만 본다 — 본문 코드 예시의 `description:` 줄이
      # 누락을 가리지 않게. 값이 비어 있으면 누락. slug·topics는 스키마 필수.
      run: |
        for f in {staged_files}; do
          if [ ! -f "$f" ]; then continue; fi
          fm=$(awk 'NR==1 && $0 != "---" {exit} NR>1 && /^---[[:space:]]*$/ {exit} NR>1 {print}' "$f")
          missing=""
          for key in title slug date description; do
            if ! printf '%s\n' "$fm" | grep -qE "^$key:[[:space:]]*[^[:space:]]"; then
              missing="$missing $key"
            fi
          done
          if ! printf '%s\n' "$fm" | grep -qE "^topics:"; then
            missing="$missing topics"
          fi
          if [ -n "$missing" ]; then
            echo "✗ $f: 필수 frontmatter 누락:$missing"
            exit 1
          fi
        done

pre-push:
  parallel: false
  commands:
    # push 직전에는 *push할 commit에서 변경된 파일만* 검사.
    # (전체 sweep을 원하면 수동으로 `npm run audit:gate` 실행)
    push-changed-files:
      # git이 stdin으로 넘기는 "<local ref> <local sha> <remote ref> <remote sha>"
      # 줄마다, 실제로 push되는 commit 범위에서 바뀐 글만 검사한다. 예전에는
      # upstream이 없으면 range=HEAD(작업 트리 vs HEAD)라 새 브랜치의 첫 push가
      # 아무것도 검사하지 않았고, 바뀐 글이 아니라 그 디렉터리 전체를 돌렸다.
      use_stdin: true
      run: |
        echo "▶ Running publish gate on commits being pushed..."
        zero=0000000000000000000000000000000000000000
        empty_tree=$(git hash-object -t tree /dev/null)
        files=""
        while read -r lref lsha rref rsha; do
          [ "$lsha" = "$zero" ] && continue  # branch deletion
          if [ "$rsha" = "$zero" ]; then
            # New remote branch: everything not yet on origin/main.
            base=$(git merge-base origin/main "$lsha" 2>/dev/null || echo "$empty_tree")
          else
            base=$rsha
          fi
          files="$files
        $(git diff --name-only --diff-filter=ACMR "$base" "$lsha" -- 'src/content/blog/*.md')"
        done
        set --
        for f in $(printf '%s\n' "$files" | sed 's/^[[:space:]]*//; /^$/d' | sort -u); do
          [ -f "$f" ] && set -- "$@" "$f"
        done
        if [ $# -eq 0 ]; then
          echo "  No blog .md changes — skip"
          exit 0
        fi
        echo "  Auditing $# changed post(s)"
        ./scripts/audit-publish-gate.sh "$@"
      fail_text: |
        ✗ Publish gate failed on commits being pushed.
        Push할 commit의 *변경 파일에* 규칙 위반이 있습니다. 수정 후 push 재시도.
        긴급 시 `git push --no-verify`로 우회 가능 (책임 본인).
        전체 sweep은 `npm run audit:gate`로 별도 실행.

# 옵션: 빌드 후 자동 검증 (수동 npm run build 시에는 별도 trigger 안 됨)
# 필요 시 prebuild hook 추가 가능

# ================================
# pull / checkout / rebase 뒤 로컬 의존성을 lockfile과 맞춤
# package-lock.json이 바뀐 경우에만 npm ci 실행 (scripts/sync-deps.sh)
# ================================
post-merge:
  commands:
    sync-deps:
      run: scripts/sync-deps.sh
post-checkout:
  commands:
    sync-deps:
      run: scripts/sync-deps.sh --since {1}
post-rewrite:
  commands:
    sync-deps:
      run: scripts/sync-deps.sh
