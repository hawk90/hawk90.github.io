name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # A push deploys unless every changed file is listed here. Listed = cannot
    # change dist/: nothing in the build (src/, astro.config.mjs, ec.config.mjs,
    # tsconfig.json, scripts/build-og.mjs via prebuild) reads these paths.
    # Do not add scripts/** (prebuild runs scripts/build-og.mjs) or *.txt
    # globs (public/ads.txt and public/robots.txt ship with the site).
    paths-ignore:
      # Docs and repo meta
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'LICENSE*'
      - 'docs/**'
      # Audit output, governance and agent material
      - 'reports/**'
      - 'archives/**'
      - 'claude/**'
      - '.claude/**'
      # Data read only by audit scripts, never by the build
      - 'data/**'
      # Local tooling; deploy pins Node itself (node-version: "24.21.0")
      - '.gitignore'
      - '.prettierrc'
      - '.prettierignore'
      - 'lefthook.yml'
      - 'renovate.json'
      - '.vscode/**'
      - '.nvmrc'
      - '.node-version'
      # Read by giscus.app from the repository, not served by the site
      - 'giscus.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Cache OG images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/og
            public/og-default.png
            .cache/og-manifest.json
          key: ${{ runner.os }}-og-${{ hashFiles('src/lib/og-themes.data.mjs', 'scripts/build-og.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-og-${{ hashFiles('src/lib/og-themes.data.mjs', 'scripts/build-og.mjs') }}-
            ${{ runner.os }}-og-

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # The content data store lives in node_modules/.astro (not .astro, which
      # only holds generated types), so it must be restored after `npm ci`,
      # which deletes node_modules. Same key as ci.yml.
      - name: Cache Astro content store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-store-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/content.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-store-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/content.config.ts') }}-

      - name: Verify publish readiness and build artifact
        run: npm run verify:release
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
