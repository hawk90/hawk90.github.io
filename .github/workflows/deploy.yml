name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
      - '_jekyll_backup/**'
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Cache Astro content layer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .astro
          key: ${{ runner.os }}-astro-${{ hashFiles('astro.config.mjs', 'src/content.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-${{ hashFiles('astro.config.mjs', 'src/content.config.ts') }}-
            ${{ runner.os }}-astro-

      - name: Cache OG images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/og
            public/og-default.png
            .cache/og-manifest.json
          key: ${{ runner.os }}-og-${{ hashFiles('src/lib/og-themes.data.mjs', 'scripts/build-og.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-og-${{ hashFiles('src/lib/og-themes.data.mjs', 'scripts/build-og.mjs') }}-
            ${{ runner.os }}-og-

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify publish readiness and build artifact
        run: npm run verify:release
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
